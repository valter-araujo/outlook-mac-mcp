[project]
name = "outlook-mac-mcp"
version = "0.7.0"
description = "MCP server for Microsoft Outlook personal accounts via Microsoft Graph API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.2.0",
    "msal>=1.38.0",
    "tzlocal>=5.4.4",
]

[project.scripts]
outlook-mac-mcp = "outlook_mac_mcp.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "mcp-types>=2.2.0",
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_mac_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

# msal ships no py.typed, and following its untyped source only trades the missing-stub
# error for no-untyped-call on every constructor. The boundary is untyped either way; the
# MsalApplication Protocol in authentication.py is what actually types it, and every msal
# response is converted at the edge instead of travelling as Any.
[[tool.mypy.overrides]]
module = ["msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: hits the real Microsoft Graph API; disabled by default"]
addopts = "-m 'not integration'"
